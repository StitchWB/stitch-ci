name: CI build-farm

# Free-public-minutes CI build-farm for MANY private repos.
#
# Pattern: a PUBLIC repo (write/merge restricted to the owners) whose CI checks
# out each PRIVATE repo at build time via a READ-ONLY token (MONOREPO_READ_TOKEN,
# a fine-grained token scoped to READ all the listed repos) and runs that repo's
# CI on free public minutes.  Private code is never published — only checked out
# transiently on the runner.  Fork PRs never receive the secret, so external
# contributions are safe; only a merged malicious commit (owners-only) could read
# the token.
#
# To add a repo: append an entry to the matrix `include` below with its
# `repo`, optional `submodules`, and its install/test commands.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"   # nightly heavy CI on free minutes

concurrency:
  group: stitch-ci
  cancel-in-progress: true

jobs:
  ci:
    name: "CI: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stitch-monorepo
            repo: StitchWB/Stitch-Account-Manager
            submodules: recursive
            workdir: python
            install: 'pip install -e ".[dev]"'
            test: "python -m pytest tests -q"
          - name: aiapiradar
            repo: WhiteBite/AIApiRadar
            submodules: ""
            workdir: "."
            install: "pip install -r requirements.txt"
            test: "python -m pytest tests -q"
    steps:
      - name: "Checkout ${{ matrix.repo }} (read-only)"
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          submodules: ${{ matrix.submodules || '' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.install }}

      - name: Run tests
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.test }}
