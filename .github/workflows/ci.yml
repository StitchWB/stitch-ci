name: CI

# Free-public-minutes CI build-farm.  Each private repo carries its own CI
# contract in `.ci.yml` (workdir/install/test); this farm checks the repo out
# read-only (MONOREPO_READ_TOKEN) and runs that contract on free minutes.
#
# BUTTONS: "Run workflow" shows a `repo` dropdown — pick one repo, or `all` to
# fan out across the whole matrix.  Nightly cron runs everything.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo to run CI for"
        type: choice
        default: all
        options:
          - all
          - StitchWB/Stitch-Account-Manager
          - WhiteBite/AIApiRadar
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: stitch-ci
  cancel-in-progress: true

jobs:
  ci:
    name: "CI: ${{ matrix.repo }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - StitchWB/Stitch-Account-Manager
          - WhiteBite/AIApiRadar
    steps:
      # matrix is not available in a job-level `if`, so the selection lives in
      # this gate step and every work step checks its output.
      - name: Selection gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.repo }}" = "all" ] || [ "${{ github.event.inputs.repo }}" = "${{ matrix.repo }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Checkout ${{ matrix.repo }} (read-only)"
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          submodules: recursive

      - name: Resolve tested sha
        if: steps.gate.outputs.run == 'true'
        id: mono_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report pending status
        if: steps.gate.outputs.run == 'true' && matrix.repo == 'StitchWB/Stitch-Account-Manager'
        env:
          READ_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state":"pending","context":"stitch-ci/python","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "https://api.github.com/repos/StitchWB/Stitch-Account-Manager/statuses/${{ steps.mono_sha.outputs.sha }}" || true

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read .ci.yml contract
        if: steps.gate.outputs.run == 'true'
        id: ci
        run: |
          pip install -q pyyaml
          python - <<'PY'
          import os, yaml
          cfg = {}
          if os.path.exists(".ci.yml"):
              cfg = yaml.safe_load(open(".ci.yml", encoding="utf-8")) or {}
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("workdir=" + str(cfg.get("workdir", ".") or ".") + "\n")
              f.write("install=" + str(cfg.get("install", "") or "") + "\n")
              f.write("test=" + str(cfg.get("test", "") or "") + "\n")
          PY

      - name: Install deps
        if: steps.gate.outputs.run == 'true' && steps.ci.outputs.install != ''
        working-directory: ${{ steps.ci.outputs.workdir }}
        run: ${{ steps.ci.outputs.install }}

      - name: Run tests
        if: steps.gate.outputs.run == 'true' && steps.ci.outputs.test != ''
        working-directory: ${{ steps.ci.outputs.workdir }}
        run: ${{ steps.ci.outputs.test }}

      - name: Report final status
        if: always() && steps.gate.outputs.run == 'true' && matrix.repo == 'StitchWB/Stitch-Account-Manager'
        env:
          READ_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
          JOB_STATE: ${{ job.status }}
        run: |
          STATE=success
          [ "$JOB_STATE" = "success" ] || STATE=failure
          curl -sf -X POST \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"state\":\"$STATE\",\"context\":\"stitch-ci/python\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://api.github.com/repos/StitchWB/Stitch-Account-Manager/statuses/${{ steps.mono_sha.outputs.sha }}" || true

  frontend:
    name: "Frontend: StitchWB/Stitch-Account-Manager"
    runs-on: ubuntu-latest
    steps:
      # Same selection semantics as the python job, monorepo-only.
      - name: Selection gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.repo }}" = "all" ] || [ "${{ github.event.inputs.repo }}" = "StitchWB/Stitch-Account-Manager" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout monorepo (read-only)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: StitchWB/Stitch-Account-Manager
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          submodules: recursive

      - name: Resolve tested sha
        if: steps.gate.outputs.run == 'true'
        id: mono_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report pending status
        if: steps.gate.outputs.run == 'true'
        env:
          READ_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state":"pending","context":"stitch-ci/frontend","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "https://api.github.com/repos/StitchWB/Stitch-Account-Manager/statuses/${{ steps.mono_sha.outputs.sha }}" || true

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: TypeScript check
        if: steps.gate.outputs.run == 'true'
        run: npx tsc --noEmit

      - name: Frontend tests (Jest)
        if: steps.gate.outputs.run == 'true'
        run: npx jest --no-coverage --passWithNoTests

      - name: Lint
        if: steps.gate.outputs.run == 'true'
        run: npm run lint --if-present

      - name: Build frontend
        if: steps.gate.outputs.run == 'true'
        run: npm run build

      - name: Report final status
        if: always() && steps.gate.outputs.run == 'true'
        env:
          READ_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
          JOB_STATE: ${{ job.status }}
        run: |
          STATE=success
          [ "$JOB_STATE" = "success" ] || STATE=failure
          curl -sf -X POST \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"state\":\"$STATE\",\"context\":\"stitch-ci/frontend\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://api.github.com/repos/StitchWB/Stitch-Account-Manager/statuses/${{ steps.mono_sha.outputs.sha }}" || true
