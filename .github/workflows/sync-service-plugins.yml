name: Sync service plugins from public

# Mirrors the 9 official service plugins (8 public + freemodel private) FROM
# their public repos (StitchWB/stitch-*) INTO the private hub's plugins-src/
# as a reviewable auto-PR, so the hub's tests and the sign/publish pipeline
# build against the latest plugin source.  Runs on this public repo's free
# minutes; the hub's own Actions are disabled.  Daily cron or manual dispatch.

on:
  workflow_dispatch: {}
  schedule:
    # Daily at 04:37 UTC (off-peak minute; staggered from sync-from-public).
    - cron: '37 4 * * *'

concurrency:
  group: sync-service-plugins
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Mirror service plugins public -> hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          repository: StitchWB/Stitch-Account-Manager
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          fetch-depth: 0
          # The auto-PR step re-auths origin with MONOREPO_WRITE_TOKEN.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # sync_service_plugins.py clones the public repos itself (they are
      # public, so no token is required).
      - name: Sync service plugins (public -> hub)
        run: python scripts/sync_service_plugins.py --hub .

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open auto-PR with the mirrored plugins
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_WRITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PR skipped: MONOREPO_WRITE_TOKEN not configured"
            exit 0
          fi
          BRANCH="sync/service-plugins-from-public-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(sync): mirror service plugins from public repos (automated public->hub sync)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/StitchWB/Stitch-Account-Manager.git"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(sync): mirror service plugins from public repos" \
            --body "Automated service-plugin mirror (public -> hub). The public repos (StitchWB/stitch-*) are the source of truth for the service plugins; this PR carries their latest source into plugins-src/ for the hub's tests and the sign/publish pipeline. Review and merge." \
            --base master \
            --head "$BRANCH"
