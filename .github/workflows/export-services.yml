name: Export services

# Sync stitch_bot / stitch_server from the private monorepo into their
# standalone repos (scripts/export_services.py --push).  Runs on this public
# repo's free minutes; the monorepo's own copy of this workflow is
# billing-blocked.

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: export-services
  cancel-in-progress: false

jobs:
  export:
    name: Sync stitch_bot/stitch_server to standalone repos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: StitchWB/Stitch-Account-Manager
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          submodules: recursive

      - name: Resolve tested sha
        id: mono_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report pending status
        env:
          READ_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state":"pending","context":"stitch-ci/export-services","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "https://api.github.com/repos/StitchWB/Stitch-Account-Manager/statuses/${{ steps.mono_sha.outputs.sha }}" || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export services
        env:
          SERVICE_EXPORT_TOKEN: ${{ secrets.SERVICE_EXPORT_TOKEN }}
        run: |
          if [ -z "$SERVICE_EXPORT_TOKEN" ]; then
            echo "export skipped: SERVICE_EXPORT_TOKEN not configured"
            python scripts/export_services.py --dest /tmp/svc-export
          else
            python scripts/export_services.py --dest /tmp/svc-export --push
          fi

      - name: Report final status
        if: always()
        env:
          READ_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
          JOB_STATE: ${{ job.status }}
        run: |
          STATE=success
          [ "$JOB_STATE" = "success" ] || STATE=failure
          curl -sf -X POST \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"state\":\"$STATE\",\"context\":\"stitch-ci/export-services\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://api.github.com/repos/StitchWB/Stitch-Account-Manager/statuses/${{ steps.mono_sha.outputs.sha }}" || true
