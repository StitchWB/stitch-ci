name: Build Smoke

# Heavy Nuitka + PyInstaller verification for the private monorepo, run on
# this public repo's free minutes (the monorepo's own Actions are
# billing-blocked).  Mirrors the monorepo's build-smoke.yml contract.

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-smoke
  cancel-in-progress: true

jobs:
  build-smoke:
    name: Build Smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: StitchWB/Stitch-Account-Manager
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          submodules: recursive

      - name: Resolve tested sha
        id: mono_sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report pending status
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state":"pending","context":"stitch-ci/build-smoke","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "https://api.github.com/repos/StitchWB/Stitch-Account-Manager/statuses/${{ steps.mono_sha.outputs.sha }}" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        working-directory: python
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller nuitka zstandard ordered-set

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile autoreg (Nuitka)
        run: python scripts/compile_autoreg.py

      - name: Verify PyInstaller build
        working-directory: python
        run: pyinstaller stitch-backend.spec --distpath dist --noconfirm

      - name: Verify artifact exists
        run: |
          if (!(Test-Path python/dist/stitch-backend.exe)) {
            Write-Error "PyInstaller did not produce stitch-backend.exe"
            exit 1
          }
          $size = (Get-Item python/dist/stitch-backend.exe).Length / 1MB
          Write-Host "OK: stitch-backend.exe ($([math]::Round($size,1)) MB)"

      - name: Report final status
        if: always()
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
          JOB_STATE: ${{ job.status }}
        run: |
          STATE=success
          [ "$JOB_STATE" = "success" ] || STATE=failure
          curl -sf -X POST \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"state\":\"$STATE\",\"context\":\"stitch-ci/build-smoke\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://api.github.com/repos/StitchWB/Stitch-Account-Manager/statuses/${{ steps.mono_sha.outputs.sha }}" || true
