name: Deploy

# Deploy button for the build-farm.  Each repo declares its deploy command in
# its `.ci.yml` under `deploy:` (single-line).  The monorepo gets a real VDS
# deploy job instead: frontend build + scripts/deploy-vds.ps1 over SSH with
# the VDS_SSH_KEY secret (key-based, no password bootstrap on the runner).
# SECURITY: write/merge here must stay owners-only - a merged malicious
# commit could otherwise read deploy secrets.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo to deploy"
        type: choice
        options:
          - StitchWB/Stitch-Account-Manager
          - WhiteBite/AIApiRadar

concurrency:
  group: stitch-deploy
  cancel-in-progress: false

jobs:
  vds:
    name: "Deploy monorepo to VDS"
    if: github.event.inputs.repo == 'StitchWB/Stitch-Account-Manager'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo (read-only)
        uses: actions/checkout@v4
        with:
          repository: StitchWB/Stitch-Account-Manager
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install SSH key
        env:
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/.ssh"
          printf '%s\n' "$VDS_SSH_KEY" > "$RUNNER_TEMP/.ssh/vds_id_ed25519"
          chmod 600 "$RUNNER_TEMP/.ssh/vds_id_ed25519"
          echo "VDS_SSH_KEY_PATH=$RUNNER_TEMP/.ssh/vds_id_ed25519" >> "$GITHUB_ENV"

      - name: Deploy to VDS
        shell: pwsh
        run: ./scripts/deploy-vds.ps1 -SkipBuild

  deploy:
    name: "Deploy: ${{ github.event.inputs.repo }}"
    if: github.event.inputs.repo != 'StitchWB/Stitch-Account-Manager'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout ${{ github.event.inputs.repo }} (read-only)"
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read .ci.yml deploy command
        id: ci
        run: |
          pip install -q pyyaml
          python - <<'PY'
          import os, yaml
          cfg = {}
          if os.path.exists(".ci.yml"):
              cfg = yaml.safe_load(open(".ci.yml", encoding="utf-8")) or {}
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("workdir=" + str(cfg.get("workdir", ".") or ".") + "\n")
              f.write("deploy=" + str(cfg.get("deploy", "") or "") + "\n")
          PY

      - name: Deploy
        if: steps.ci.outputs.deploy != ''
        working-directory: ${{ steps.ci.outputs.workdir }}
        env:
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          DEPLOY_TOKEN: ${{ secrets.SERVICE_EXPORT_TOKEN }}
          STITCH_PUBLISH_URL: ${{ secrets.STITCH_PUBLISH_URL }}
          STITCH_ADMIN_KEY: ${{ secrets.STITCH_ADMIN_KEY }}
        run: ${{ steps.ci.outputs.deploy }}
